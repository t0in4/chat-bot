# EMBEDDED H2 (no TCP server needed)
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# H2 Console
quarkus.h2-console.enable=true
quarkus.langchain4j.tools.enabled=true

quarkus.hibernate-orm.log.sql=true
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-response=true
quarkus.redis.hosts=redis://localhost:6379
quarkus.http.auth.permission.authenticated.paths=/ride/chat/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.oidc.enabled=false  # If not using OIDC
# GigaChat timeout
quarkus.langchain4j.gigachat.timeout=30s

quarkus.langchain4j.redis.dimension=768
quarkus.langchain4j.redis.hosts=redis://localhost:6379

# Reranking model path for BAAI/bge-reranker-large
embedding.model.path=protected

# Explicitly set OpenAI as default provider (satisfies BeansProcessor)
quarkus.langchain4j.chat-model.default-provider=openai

# Dummy OpenAI config (no real calls)
quarkus.langchain4j.openai.chat-model.model-id=gpt-4o-mini
quarkus.langchain4j.openai.embedding-model.model-id=text-embedding-3-small

# Your GigaChat named config overrides for injection
quarkus.langchain4j.gigachat.chat-model."giga".name=giga
quarkus.langchain4j.embedding-store.in-memory.enabled=true
quarkus.langchain4j.embedding-model.default-provider=local-embed